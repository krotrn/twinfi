name: Docs

# Builds the documentation website (README + docs/) and publishes it to
# GitHub Pages at https://krotrn.github.io/twinfi/. Pull requests only build it.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - llms.txt
      - docs/**
      - docs-theme/**
      - zensical.toml
      - scripts/build_site.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - llms.txt
      - docs/**
      - docs-theme/**
      - zensical.toml
      - scripts/build_site.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Zensical
        run: python -m pip install "zensical>=0.1,<0.2"

      - name: Build
        run: |
          python scripts/build_site.py
          zensical build --clean

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
