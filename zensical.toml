# Documentation website, published to GitHub Pages by .github/workflows/docs.yml.
# Build locally: scripts/build_site.py && zensical serve
[project]
site_name = "twinfi"
site_url = "https://krotrn.github.io/twinfi/"
site_description = "Run a Wi-Fi hotspot on Linux while staying connected to Wi-Fi (AP+STA)."
site_author = "krotrn"
repo_url = "https://github.com/krotrn/twinfi"
repo_name = "krotrn/twinfi"
edit_uri = ""
docs_dir = "site-src"
copyright = "MIT licensed"

nav = [
  { "Home" = "index.md" },
  { "How it works" = "how-it-works.md" },
  { "5 GHz Wi-Fi" = "5ghz-wifi.md" },
  { "Wi-Fi Direct" = "wifi-direct.md" },
  { "JSON output" = "json-output.md" },
  { "Architecture" = "ARCHITECTURE.md" },
]

[project.theme]
variant = "modern"
custom_dir = "docs-theme"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
]

# Follows the system setting until the reader picks light or dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "System theme"

# Zensical's default extension set (admonitions, tabs, details, footnotes,
# emoji, task lists, keys, highlighting...) plus the mermaid fence format.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/krotrn/twinfi"
